{% extends "base.html" %}

{% block title %}Вход — {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="card narrow">
    <h1>Вход</h1>

    <form method="post" novalidate>
        {% csrf_token %}
        <div class="form-group">
            <label for="{{ form.username.id_for_label }}">Логин</label>
            {{ form.username }}
        </div>
        <div class="form-group">
            <label for="{{ form.password.id_for_label }}">Пароль</label>
            {{ form.password }}
        </div>
        <button type="submit" class="btn primary full">Войти</button>
    </form>

    <p class="muted center">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
</div>
{% endblock %}
